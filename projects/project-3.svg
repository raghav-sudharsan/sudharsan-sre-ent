<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#07070a; font-family:'JetBrains Mono', 'SF Pro Display', -apple-system, monospace;">
  <defs>
    <radialGradient id="bgGlowRel" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0a0a14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldGlowRel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6c875" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e6c875" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlowRel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowRel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="cardGradRel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151522" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b0b12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="relFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6c875"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="gridRel" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlowRel)" />
  <rect width="1600" height="900" fill="url(#gridRel)" />
  <circle cx="450" cy="380" r="280" fill="url(#goldGlowRel)" />
  <circle cx="1150" cy="400" r="280" fill="url(#emeraldGlowRel)" />

  <!-- Top System Header Bar -->
