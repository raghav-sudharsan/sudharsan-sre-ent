    <rect x="60" y="40" width="1480" height="54" rx="12" fill="#0d0d17" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="95" cy="67" r="6" fill="#e6c875" />
    <circle cx="95" cy="67" r="10" fill="#e6c875" fill-opacity="0.2" />
    <text x="115" y="72" fill="#f5f5f7" font-size="13" font-weight="600" letter-spacing="1.5">INFRASTRUCTURE &amp; RELEASE AUTOMATION // POWERSHELL &amp; WINRM</text>
    <text x="690" y="72" fill="#71717a" font-size="12">SCOPE: REUSABLE PRODUCTION RELEASE SUITE FOR MONOLITHIC IIS/.NET APPS</text>

    <rect x="1200" y="52" width="140" height="30" rx="6" fill="rgba(230,200,117,0.08)" stroke="rgba(230,200,117,0.3)" />
    <text x="1215" y="72" fill="#e6c875" font-size="11" font-weight="600" letter-spacing="1">ZERO CONFIG DRIFT</text>

    <rect x="1360" y="52" width="160" height="30" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" />
    <text x="1375" y="72" fill="#34d399" font-size="11" font-weight="600" letter-spacing="1">ROLLBACK READY</text>
  </g>

  <!-- Left Half: PowerShell Automation Script & Execution Terminal -->
  <g id="rel-terminal" filter="url(#shadowRel)">
    <rect x="60" y="120" width="560" height="640" rx="18" fill="url(#cardGradRel)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <path d="M 60 138 C 60 128 68 120 78 120 L 602 120 C 612 120 620 128 620 138 L 620 166 L 60 166 Z" fill="#141424" />
    <circle cx="88" cy="143" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="106" cy="143" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="124" cy="143" r="5" fill="#10b981" opacity="0.8"/>
    <text x="150" y="147" fill="#71717a" font-size="11">powershell - Invoke-EnterpriseRelease.ps1</text>

    <g transform="translate(85, 195)" font-size="11.5" line-height="1.6">
      <text y="0" fill="#71717a"># Automated IIS Release Framework with WinRM Orchestration</text>
      <text y="24" fill="#e6c875" font-weight="600">PS C:\Ops&gt; .\Deploy-Release.ps1 -Environment "Production" -Nodes $Cluster</text>
      <text y="50" fill="#38bdf8">[PHASE 1] PRE-DEPLOYMENT INTEGRITY CHECK</text>
      <text y="72" fill="#a1a1aa">  * Validating WinRM connectivity to Node01, Node02 ... [OK]</text>
      <text y="94" fill="#a1a1aa">  * Comparing appsettings.json against config schema ... [0 DRIFT]</text>
      <text y="116" fill="#34d399">  * SHA-256 Checksum: e3b0c44298fc1c149afbf4c8996fb92427ae41e4 ... [MATCHED]</text>

      <text y="150" fill="#38bdf8">[PHASE 2] AUTOMATED BACKUP &amp; DRAIN</text>
      <text y="172" fill="#a1a1aa">  * Creating point-in-time snapshot: D:\Backups\Release_20260917_v4.2</text>
      <text y="194" fill="#a1a1aa">  * Stopping IIS Application Pool "FintechCorePool" gracefully</text>
      <text y="216" fill="#34d399">  * In-flight requests drained: 0 dropped transactions</text>

      <text y="250" fill="#38bdf8">[PHASE 3] ATOMIC ARTIFACT EXTRACTION &amp; POOL RESTART</text>
      <text y="272" fill="#a1a1aa">  * Copying binary release package via remote session</text>
      <text y="294" fill="#a1a1aa">  * Starting IIS Application Pool &amp; Worker Process w3wp.exe</text>
      <text y="316" fill="#34d399">  * Pool Status: Started (Worker PID 7108)</text>

      <text y="350" fill="#e6c875" font-weight="600">[PHASE 4] PESTER SANITY TEST SUITE</text>
      <text y="372" fill="#34d399">  ✔ [PASS] HTTP GET /healthcheck returns 200 OK in 14.2ms</text>
      <text y="394" fill="#34d399">  ✔ [PASS] SQL Server DB Connection Pool initialized (20/20 active)</text>
      <text y="416" fill="#34d399">  ✔ [PASS] Security headers validated in response</text>
      <text y="440" fill="#10b981">[SUCCESS] Release completed in 2m 45s. Rollback trigger disarmed.</text>

      <rect x="0" y="470" width="12" height="18" fill="#e6c875" opacity="0.8"/>
    </g>

    <rect x="80" y="695" width="520" height="45" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
