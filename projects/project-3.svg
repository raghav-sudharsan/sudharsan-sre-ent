  <!-- Right Half: Release Automation Workflow Architecture -->
  <g id="rel-workflow" filter="url(#shadowRel)">
    <rect x="650" y="120" width="890" height="640" rx="18" fill="url(#cardGradRel)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="685" y="165" fill="#e6c875" font-size="14" font-weight="600" letter-spacing="2">AUTOMATED RELEASE LIFECYCLE WORKFLOW</text>
    <text x="685" y="188" fill="#71717a" font-size="11">PRE-DEPLOY VALIDATION ➔ WINRM ORCHESTRATION ➔ SNAPSHOT BACKUP ➔ HEALTH AUDIT</text>
    <line x1="685" y1="205" x2="1505" y2="205" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Step 1: Pre-Deploy Checks -->
    <g transform="translate(685, 235)">
      <rect x="0" y="0" width="240" height="110" rx="12" fill="#131322" stroke="#e6c875" stroke-width="1.2" />
      <text x="120" y="32" fill="#e6c875" font-size="11" text-anchor="middle" font-weight="700">01. PRE-DEPLOY CHECK</text>
      <text x="120" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Config Drift Inspection</text>
      <text x="120" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">SHA-256 Hash Verification</text>
      <text x="120" y="93" fill="#34d399" font-size="9" text-anchor="middle">WinRM Connectivity: Verified</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 925 290 L 975 290" stroke="url(#relFlow)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 2: Automated Backup & Drain -->
    <g transform="translate(980, 235)">
      <rect x="0" y="0" width="240" height="110" rx="12" fill="#131322" stroke="#38bdf8" stroke-width="1.2" />
      <text x="120" y="32" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="700">02. POINT-IN-TIME SNAPSHOT</text>
      <text x="120" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Automated App &amp; Config Backup</text>
      <text x="120" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">Graceful Worker Drain</text>
      <text x="120" y="93" fill="#34d399" font-size="9" text-anchor="middle">Zero Transaction Loss</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 1220 290 L 1270 290" stroke="url(#relFlow)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 3: Remote Node Rollout -->
    <g transform="translate(1275, 235)">
      <rect x="0" y="0" width="235" height="110" rx="12" fill="#131322" stroke="#a855f7" stroke-width="1.2" />
      <text x="117" y="32" fill="#c084fc" font-size="11" text-anchor="middle" font-weight="700">03. WINRM ROLLOUT</text>
      <text x="117" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Parallel Node Dispatch</text>
      <text x="117" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">IIS App Pool Controlled Recycle</text>
      <text x="117" y="93" fill="#34d399" font-size="9" text-anchor="middle">Fast Binary Overwrite</text>
    </g>

    <!-- Downward Route to Step 4 & 5 -->
    <path d="M 1390 345 L 1390 400 L 805 400 L 805 435" stroke="url(#relFlow)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 4: Health Probes & Pester Tests -->
    <g transform="translate(685, 440)">
      <rect x="0" y="0" width="370" height="120" rx="12" fill="#131322" stroke="#10b981" stroke-width="1.5" />
      <text x="185" y="32" fill="#34d399" font-size="11" text-anchor="middle" font-weight="700">04. POST-DEPLOY PESTER AUDIT</text>
      <text x="185" y="55" fill="#f5f5f7" font-size="12" text-anchor="middle">Automated Smoke Tests &amp; DB Probes</text>
      <text x="185" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">HTTP Endpoint Latency &lt; 25ms • DB Pool Verified</text>
      <text x="185" y="95" fill="#34d399" font-size="9" text-anchor="middle">ALL 12 TESTS PASSED</text>
    </g>

    <!-- Arrow 4 to 5 -->
    <path d="M 1055 500 L 1145 500" stroke="url(#relFlow)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 5: Rollback Safeguard Engine -->
    <g transform="translate(1150, 440)">
      <rect x="0" y="0" width="360" height="120" rx="12" fill="#180f14" stroke="#fb7185" stroke-width="1.2" />
      <text x="180" y="32" fill="#fb7185" font-size="11" text-anchor="middle" font-weight="700">05. SAFEGUARD &amp; ZERO-TOUCH ROLLBACK</text>
      <text x="180" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Automatic Instant Restoration</text>
      <text x="180" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">Reverts to Snapshot in &lt; 30s upon Failure</text>
      <text x="180" y="95" fill="#34d399" font-size="9" text-anchor="middle">Production Safety Certified</text>
    </g>

    <!-- Bottom Stat Summary Strip -->
    <g transform="translate(685, 595)">
      <rect x="0" y="0" width="825" height="135" rx="12" fill="#090911" stroke="rgba(255,255,255,0.06)" />
      
      <g transform="translate(30, 24)">
        <text y="0" fill="#71717a" font-size="10">AVERAGE RELEASE DURATION</text>
        <text y="24" fill="#34d399" font-size="18" font-weight="700">2m 45s</text>
        <text y="42" fill="#52525b" font-size="9">100% automated script execution</text>
      </g>
      <line x1="260" y1="15" x2="260" y2="75" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(290, 24)">
        <text y="0" fill="#71717a" font-size="10">CONFIGURATION DRIFT</text>
        <text y="24" fill="#e6c875" font-size="18" font-weight="700">0.00%</text>
        <text y="42" fill="#52525b" font-size="9">Strict schema &amp; hash matching</text>
      </g>
      <line x1="550" y1="15" x2="550" y2="75" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(580, 24)">
        <text y="0" fill="#71717a" font-size="10">FAILOVER / ROLLBACK RTO</text>
        <text y="24" fill="#38bdf8" font-size="18" font-weight="700">&lt; 30 Seconds</text>
        <text y="42" fill="#52525b" font-size="9">Instant rollback on test failure</text>
      </g>

      <!-- Bottom audit strip -->
