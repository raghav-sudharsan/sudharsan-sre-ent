      <text x="45" y="107" fill="#a1a1aa" font-size="10">FRAMEWORK: <tspan fill="#e6c875">PowerShell / WinRM / Pester</tspan> • Audit trail logged to central operations vault</text>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="60" y="810" fill="#52525b" font-size="12" letter-spacing="3">SUDHARSAN S // SRE &amp; DEVOPS PORTFOLIO</text>
  <text x="1540" y="810" fill="#52525b" font-size="12" text-anchor="end">REUSABLE PRODUCTION RELEASE AUTOMATION</text>
</svg>
