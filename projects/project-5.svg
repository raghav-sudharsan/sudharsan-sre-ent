      <stop offset="0%" stop-color="#1c1610" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e0a06" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

