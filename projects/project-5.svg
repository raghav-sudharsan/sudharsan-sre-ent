      <!-- Bottom mini bar -->
      <rect x="30" y="88" width="695" height="34" rx="6" fill="rgba(255,255,255,0.03)" />
      <text x="45" y="110" fill="#a1a1aa" font-size="10">LATEST AUDIT LOG: <tspan fill="#34d399">/var/reports/aws_inventory_2026-09-17.md</tspan> • HASH: sha256:d83f2a1...</text>
