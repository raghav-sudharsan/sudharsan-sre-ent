      <g transform="translate(30, 24)">
        <text y="0" fill="#71717a" font-size="10" font-weight="600">COST OPTIMIZATION SAVINGS</text>
        <text y="26" fill="#34d399" font-size="22" font-weight="700">$1,420 / mo</text>
        <text y="46" fill="#a1a1aa" font-size="10">Idle resources detected &amp; cleaned</text>
      </g>

      <line x1="280" y1="20" x2="280" y2="125" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(310, 24)">
        <text y="0" fill="#71717a" font-size="10" font-weight="600">MANUAL AUDIT HOURS SAVED</text>
        <text y="26" fill="#e6c875" font-size="22" font-weight="700">12 hrs / wk</text>
        <text y="46" fill="#a1a1aa" font-size="10">Replaced with automated cron</text>
      </g>

      <line x1="530" y1="20" x2="530" y2="125" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(560, 24)">
