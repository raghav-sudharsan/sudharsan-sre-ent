      <text x="20" y="70" fill="#a1a1aa" font-size="11">Subnets: <tspan fill="#f5f5f7">16 (Public + Private)</tspan></text>
      <text x="20" y="92" fill="#a1a1aa" font-size="11">NAT Gateways: <tspan fill="#f5f5f7">4 High-Availability</tspan></text>
      <text x="20" y="114" fill="#a1a1aa" font-size="11">Security Groups: <tspan fill="#34d399">No 0.0.0.0/0 on SSH/RDP</tspan></text>
