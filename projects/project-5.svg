    <text x="1365" y="72" fill="#34d399" font-size="11" font-weight="600" letter-spacing="1">ORPHAN ASSETS: 0</text>
  </g>

  <!-- Left Half: Bash Scripting & CLI Execution Terminal -->
  <g id="cli-terminal" filter="url(#shadow5)">
    <rect x="60" y="120" width="620" height="640" rx="18" fill="url(#cardGrad5)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Terminal Header -->
    <path d="M 60 138 C 60 128 68 120 78 120 L 662 120 C 672 120 680 128 680 138 L 680 166 L 60 166 Z" fill="#19120a" />
    <circle cx="88" cy="143" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="106" cy="143" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="124" cy="143" r="5" fill="#10b981" opacity="0.8"/>
    <text x="150" y="147" fill="#71717a" font-size="11">bash - ./aws_resource_tracker.sh (Daily Automation)</text>

    <!-- Script Content -->
    <g transform="translate(85, 195)" font-size="11.5" line-height="1.6">
      <text y="0" fill="#71717a">#!/usr/bin/env bash</text>
      <text y="24" fill="#71717a"># Author: Sudharsan S (SRE) - Automated AWS Audit Utility</text>
      <text y="48" fill="#e6c875" font-weight="600">set -euo pipefail</text>
      
      <text y="80" fill="#38bdf8">echo "[+] DISCOVERING AWS EC2 INSTANCES..."</text>
      <text y="104" fill="#f5f5f7">aws ec2 describe-instances \</text>
      <text y="124" fill="#a1a1aa">  --query 'Reservations[*].Instances[*].[InstanceId,State.Name,InstanceType]' \</text>
      <text y="144" fill="#a1a1aa">  --output table &gt;&gt; /var/reports/aws_inventory.log</text>

      <text y="176" fill="#38bdf8">echo "[+] AUDITING S3 BUCKETS &amp; PUBLIC ACCESS..."</text>
      <text y="200" fill="#f5f5f7">aws s3api list-buckets --query 'Buckets[*].Name' --output json</text>
      <text y="224" fill="#34d399">✔ 18/18 Buckets Verified: PublicAccessBlock ACTIVE</text>

      <text y="256" fill="#38bdf8">echo "[+] DISCOVERING IAM USERS &amp; ACCESS KEYS..."</text>
      <text y="280" fill="#f5f5f7">aws iam list-users --query 'Users[*].[UserName,CreateDate]'</text>
      <text y="304" fill="#34d399">✔ Zero unrotated access keys older than 90 days</text>

      <text y="336" fill="#38bdf8">echo "[+] AUDITING UNATTACHED EBS VOLUMES (COST LEAKS)..."</text>
      <text y="360" fill="#f5f5f7">aws ec2 describe-volumes --filters Name=status,Values=available</text>
      <text y="384" fill="#10b981">✔ 0 Unattached volumes found - Clean bill</text>

      <text y="420" fill="#e6c875" font-weight="600">[CRON DAEMON] 0 6 * * * /opt/scripts/aws_tracker.sh</text>
      <text y="444" fill="#a1a1aa">Report published to S3 audit bucket &amp; emailed to ops@craftsilicon.com</text>
      <text y="468" fill="#71717a">Execution elapsed time: 24.2 seconds • API calls: 14</text>

      <rect x="0" y="495" width="12" height="18" fill="#f59e0b" opacity="0.8"/>
    </g>

