<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#07070a; font-family:'JetBrains Mono', 'SF Pro Display', -apple-system, monospace;">
  <defs>
    <radialGradient id="bgGlowIIS" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#090d16" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowIIS" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="cardGradIIS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="gridIIS" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlowIIS)" />
  <rect width="1600" height="900" fill="url(#gridIIS)" />
  <circle cx="500" cy="380" r="300" fill="url(#blueGlow)" />

  <!-- Top System Header Bar -->
  <g id="top-bar">
    <rect x="60" y="40" width="1480" height="54" rx="12" fill="#0b111c" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="95" cy="67" r="6" fill="#3b82f6" />
    <circle cx="95" cy="67" r="10" fill="#3b82f6" fill-opacity="0.2" />
    <text x="115" y="72" fill="#f5f5f7" font-size="13" font-weight="600" letter-spacing="1.5">.NET APPLICATION MANAGEMENT &amp; IIS 10 WEB TIER</text>
    <text x="610" y="72" fill="#71717a" font-size="12">FLOW: CLIENT → LOAD BALANCER / NGINX → IIS WEB NODES → APPLICATION LAYER → DATABASE</text>

    <rect x="1200" y="52" width="140" height="30" rx="6" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.3)" />
    <text x="1215" y="72" fill="#60a5fa" font-size="11" font-weight="600" letter-spacing="1">IIS 10 CLUSTER</text>

    <rect x="1360" y="52" width="160" height="30" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" />
    <text x="1375" y="72" fill="#34d399" font-size="11" font-weight="600" letter-spacing="1">VAPT HARDENED</text>
  </g>

  <!-- Left Half: PowerShell & IIS AppCmd Diagnostics Terminal -->
  <g id="iis-terminal" filter="url(#shadowIIS)">
    <rect x="60" y="120" width="550" height="640" rx="18" fill="url(#cardGradIIS)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <path d="M 60 138 C 60 128 68 120 78 120 L 592 120 C 602 120 610 128 610 138 L 610 166 L 60 166 Z" fill="#131c2e" />
    <circle cx="88" cy="143" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="106" cy="143" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="124" cy="143" r="5" fill="#10b981" opacity="0.8"/>
    <text x="150" y="147" fill="#71717a" font-size="11">powershell - Windows Server 2022 (IIS 10 Host)</text>

    <g transform="translate(85, 195)" font-size="11.5" line-height="1.6">
      <text y="0" fill="#e6c875" font-weight="600">PS C:\&gt; Import-Module WebAdministration</text>
      <text y="24" fill="#e6c875" font-weight="600">PS C:\&gt; Get-WebAppPoolState -Name "FintechAppPool"</text>
      <text y="48" fill="#34d399">State: Started (Worker Process ID: w3wp.exe PID 6104)</text>

      <text y="80" fill="#71717a"># Inspecting Application Pool Recycling Limits</text>
      <text y="104" fill="#60a5fa">PS C:\&gt; Get-ItemProperty IIS:\AppPools\FintechAppPool</text>
      <text y="128" fill="#f5f5f7">  recycling.periodicRestart.time: 00:00:00 (Fixed Schedule)</text>
      <text y="152" fill="#f5f5f7">  recycling.periodicRestart.schedule: 03:30:00 AM (Low Traffic)</text>
      <text y="176" fill="#f5f5f7">  processModel.maxWorkerProcesses: 1 (Web Garden disabled)</text>
      <text y="200" fill="#34d399">  processModel.idleTimeout: 00:00:00 (Prevent spin-down)</text>

      <text y="235" fill="#e6c875" font-weight="600">PS C:\&gt; # VAPT Security Header Audit</text>
      <text y="259" fill="#f5f5f7">PS C:\&gt; Get-WebConfigurationProperty -Filter ...</text>
      <text y="283" fill="#34d399">✔ Strict-Transport-Security: max-age=31536000; includeSubDomains</text>
      <text y="307" fill="#34d399">✔ Content-Security-Policy: default-src 'self'; frame-ancestors 'none'</text>
      <text y="331" fill="#34d399">✔ X-Frame-Options: DENY • X-Content-Type-Options: nosniff</text>
      <text y="355" fill="#34d399">✔ Permissions-Policy: camera=(), microphone=(), geolocation=()</text>

      <text y="390" fill="#71717a"># IIS FastCGI &amp; .NET HTTP Pipeline Triage</text>
      <text y="414" fill="#a1a1aa">Event Log: Application Event ID 1000 - Zero Unhandled Crashes</text>
      <text y="438" fill="#a1a1aa">SQL Connection Pool: 48 active / 100 max (Healthy)</text>
      <text y="462" fill="#34d399">HTTP Status Code Distribution: 99.98% 200 OK</text>

      <rect x="0" y="490" width="12" height="18" fill="#60a5fa" opacity="0.8"/>
    </g>

    <rect x="80" y="695" width="510" height="45" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
    <text x="100" y="722" fill="#a1a1aa" font-size="11">PLATFORM: <tspan fill="#60a5fa">IIS 10 / ASP.NET 4.8</tspan> | SECURITY: <tspan fill="#34d399">VAPT REMEDIATED &amp; VERIFIED</tspan></text>
  </g>

  <!-- Right Half: IIS Architecture Topology -->
  <g id="iis-topology" filter="url(#shadowIIS)">
    <rect x="640" y="120" width="900" height="640" rx="18" fill="url(#cardGradIIS)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="675" y="165" fill="#60a5fa" font-size="14" font-weight="600" letter-spacing="2">IIS &amp; .NET PRODUCTION ARCHITECTURE</text>
    <text x="675" y="188" fill="#71717a" font-size="11">CLIENT → LOAD BALANCER / NGINX → IIS WEB NODES → APPLICATION LAYER → DATABASE</text>
    <line x1="675" y1="205" x2="1495" y2="205" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Stage 1: Client Ingress -->
    <g transform="translate(675, 235)">
      <rect x="0" y="0" width="170" height="110" rx="12" fill="#0d1424" stroke="#60a5fa" stroke-width="1.2" />
      <text x="85" y="32" fill="#60a5fa" font-size="11" text-anchor="middle" font-weight="600">CLIENT INGRESS</text>
      <text x="85" y="55" fill="#f5f5f7" font-size="12" text-anchor="middle">Public Banking Users</text>
      <text x="85" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">HTTPS / 443</text>
      <text x="85" y="93" fill="#34d399" font-size="9" text-anchor="middle">TLS 1.3 Strict</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 845 290 L 895 290" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Stage 2: Nginx Load Balancer -->
    <g transform="translate(900, 235)">
      <rect x="0" y="0" width="190" height="110" rx="12" fill="#0d1424" stroke="#38bdf8" stroke-width="1.5" />
      <text x="95" y="32" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="700">NGINX LOAD BALANCER</text>
      <text x="95" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Reverse Proxy / WAF</text>
      <text x="95" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">ModSecurity • Header Injection</text>
      <text x="95" y="93" fill="#34d399" font-size="9" text-anchor="middle">Least-Connections Routing</text>
    </g>

    <!-- Arrow 2 to 3 (Split to Web Nodes) -->
    <path d="M 1090 290 L 1140 290" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Stage 3: IIS Web Nodes Cluster -->
    <g transform="translate(1145, 235)">
      <rect x="0" y="0" width="350" height="110" rx="12" fill="#0f172a" stroke="#e6c875" stroke-width="1.5" />
      <text x="175" y="32" fill="#e6c875" font-size="12" text-anchor="middle" font-weight="700">IIS 10 WEB NODES (DUAL CLUSTER)</text>
      <text x="175" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Web Node 01 &amp; Web Node 02</text>
      <text x="175" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">Dedicated App Pools • Worker Isolation</text>
      <text x="175" y="93" fill="#34d399" font-size="9" text-anchor="middle">windows_exporter Telemetry Scraped</text>
    </g>

    <!-- Arrow down to Application Layer -->
    <path d="M 1320 345 L 1320 400 L 760 400 L 760 435" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Stage 4: Application Layer (ASP.NET) -->
    <g transform="translate(675, 440)">
      <rect x="0" y="0" width="370" height="115" rx="12" fill="#141829" stroke="#60a5fa" stroke-width="1.2" />
      <text x="185" y="32" fill="#60a5fa" font-size="11" text-anchor="middle" font-weight="700">APPLICATION LAYER (.NET RUNTIME)</text>
      <text x="185" y="55" fill="#f5f5f7" font-size="12" text-anchor="middle">ASP.NET / .NET Framework 4.8</text>
      <text x="185" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">Fintech Core Banking Logic • Session State Store</text>
      <text x="185" y="95" fill="#34d399" font-size="9" text-anchor="middle">Zero Thread Exhaustion • Memory Stabilized</text>
    </g>

    <!-- Arrow 4 to 5 -->
    <path d="M 1045 495 L 1140 495" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Stage 5: Database Tier (SQL Server) -->
    <g transform="translate(1145, 440)">
      <rect x="0" y="0" width="350" height="115" rx="12" fill="#171220" stroke="#a855f7" stroke-width="1.2" />
      <text x="175" y="32" fill="#c084fc" font-size="11" text-anchor="middle" font-weight="700">DATABASE TIER (SQL SERVER)</text>
      <text x="175" y="55" fill="#f5f5f7" font-size="12" text-anchor="middle">Microsoft SQL Server 2019</text>
      <text x="175" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">Transactional Integrity • AlwaysOn HA</text>
      <text x="175" y="95" fill="#34d399" font-size="9" text-anchor="middle">Connection Pool Tuned • Automated Log Backups</text>
    </g>

    <!-- Bottom Telemetry HUD Bar inside Diagram -->
    <g transform="translate(675, 595)">
      <rect x="0" y="0" width="820" height="135" rx="12" fill="#080c14" stroke="rgba(255,255,255,0.06)" />
      
      <g transform="translate(30, 24)">
        <text y="0" fill="#71717a" font-size="10">IIS APPLICATION POOL</text>
        <text y="24" fill="#34d399" font-size="18" font-weight="700">Tuned Recycling</text>
        <text y="42" fill="#52525b" font-size="9">Worker thread starvation: 0</text>
      </g>
      <line x1="260" y1="15" x2="260" y2="75" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(290, 24)">
        <text y="0" fill="#71717a" font-size="10">VAPT SECURITY COMPLIANCE</text>
        <text y="24" fill="#e6c875" font-size="18" font-weight="700">100% Remediated</text>
        <text y="42" fill="#52525b" font-size="9">HSTS / CSP / Permissions Policy</text>
      </g>
      <line x1="550" y1="15" x2="550" y2="75" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(580, 24)">
        <text y="0" fill="#71717a" font-size="10">PRODUCTION UPTIME</text>
        <text y="24" fill="#10b981" font-size="18" font-weight="700">99.99% Availability</text>
        <text y="42" fill="#52525b" font-size="9">Fintech high-volume processing</text>
      </g>

      <!-- Bottom audit strip -->
      <rect x="30" y="85" width="760" height="35" rx="6" fill="rgba(255,255,255,0.03)" />
      <text x="45" y="107" fill="#a1a1aa" font-size="10">IIS RUNTIME DIAGNOSTICS: <tspan fill="#34d399">HTTP Error 500.19 &amp; 503 Zero Occurrences</tspan> • ModSecurity Ingress Guard Active</text>
    </g>

  </g>

  <!-- Bottom Brand Watermark -->
  <text x="60" y="810" fill="#52525b" font-size="12" letter-spacing="3">SUDHARSAN S // SRE &amp; DEVOPS PORTFOLIO</text>
  <text x="1540" y="810" fill="#52525b" font-size="12" text-anchor="end">IIS 10 &amp; .NET APPLICATION INFRASTRUCTURE</text>
</svg>
