    <rect x="950" y="120" width="590" height="640" rx="18" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Header -->
    <path d="M 950 138 C 950 128 958 120 968 120 L 1530 120 C 1540 120 1548 128 1548 138 L 1548 166 L 950 166 Z" fill="#0f1613" />
    <circle cx="978" cy="143" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="996" cy="143" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="1014" cy="143" r="5" fill="#10b981" opacity="0.8"/>
    <text x="1035" y="147" fill="#71717a" font-size="11">terminal - sudharsan@fintech-host-01: ~</text>

    <!-- Terminal Content -->
    <g transform="translate(975, 195)" font-size="11" line-height="1.6">
      <text y="0" fill="#e6c875" font-weight="600">$ systemctl status fintech-core.service</text>
      <text y="24" fill="#f5f5f7">● fintech-core.service - MSME Core Banking Java App</text>
      <text y="48" fill="#a1a1aa">   Loaded: loaded (/etc/systemd/system/fintech-core.service; enabled)</text>
      <text y="72" fill="#34d399" font-weight="600">   Active: active (running) since Thu 2026-09-17 14:22:05 IST</text>
      <text y="96" fill="#71717a">   Docs: https://internal.craftsilicon.com/sre/docs</text>
      <text y="120" fill="#a1a1aa"> Main PID: 4129 (java)</text>
      <text y="144" fill="#a1a1aa">    Tasks: 44 (limit: 4915)</text>
      <text y="168" fill="#a1a1aa">   Memory: 1.4G (max: 2.0G, limit: 3.5G)</text>
      <text y="192" fill="#a1a1aa">      CPU: 4.8% (4 vCPUs allocated)</text>
      <text y="216" fill="#a1a1aa">   CGroup: /system.slice/fintech-core.service</text>
      <text y="238" fill="#71717a">           └─4129 /usr/bin/java -Xms1024m -Xmx2048m -jar ...</text>

      <text y="275" fill="#e6c875" font-weight="600">$ /opt/fintech/bin/verify_post_deploy.sh</text>
      <text y="299" fill="#a1a1aa">[INFO] Executing automated sanity checks...</text>
      <text y="323" fill="#38bdf8">[CHECK 1] Ping JVM Management JMX Port 9010 ... [OK]</text>
      <text y="347" fill="#38bdf8">[CHECK 2] Validate HikariCP Database Connection Pool ... [OK: 20/20 active]</text>
      <text y="371" fill="#38bdf8">[CHECK 3] Test Transaction Settlement API Probe ... [200 OK in 12ms]</text>
      <text y="395" fill="#34d399">[SUCCESS] All 14 verification assertions passed without errors.</text>
      <text y="419" fill="#10b981">[AUDIT] Release tag v3.4.2 logged to /var/log/sre_releases.log</text>

      <text y="460" fill="#e6c875" font-weight="600">$ cat /etc/security/limits.d/fintech.conf</text>
      <text y="484" fill="#71717a">fintech-svc soft nofile 65536</text>
      <text y="508" fill="#71717a">fintech-svc hard nofile 65536</text>
      <text y="532" fill="#34d399">Kernel file descriptor limit configured for high concurrency</text>

      <rect x="0" y="555" width="12" height="18" fill="#10b981" opacity="0.8"/>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="60" y="810" fill="#52525b" font-size="12" letter-spacing="3">SUDHARSAN S // SRE &amp; DEVOPS PORTFOLIO</text>
  <text x="1540" y="810" fill="#52525b" font-size="12" text-anchor="end">MSME FINTECH RELEASE ENGINEERING</text>
</svg>
