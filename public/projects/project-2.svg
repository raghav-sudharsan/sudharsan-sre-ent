<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#07070a; font-family:'JetBrains Mono', 'SF Pro Display', -apple-system, monospace;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow2" cx="40%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#0a1210" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6c875" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e6c875" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c19" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b100e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pipelineLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6c875"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow2)" />
  <rect width="1600" height="900" fill="url(#grid2)" />

  <circle cx="400" cy="400" r="300" fill="url(#emeraldGlow)" />
  <circle cx="1200" cy="420" r="280" fill="url(#goldGlow2)" />

  <!-- Top System Header Bar -->
  <g id="top-bar">
    <rect x="60" y="40" width="1480" height="54" rx="12" fill="#0c1311" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="95" cy="67" r="6" fill="#10b981" />
    <circle cx="95" cy="67" r="10" fill="#10b981" fill-opacity="0.2" />
    <text x="115" y="72" fill="#f5f5f7" font-size="13" font-weight="600" letter-spacing="1.5">CI/CD // AZURE DEVOPS &amp; LINUX SYSTEMD DEPLOYMENT</text>
    <text x="590" y="72" fill="#71717a" font-size="12">TARGET: FINTECH MSME ENTERPRISE HOSTS</text>

    <rect x="1170" y="52" width="160" height="30" rx="6" fill="rgba(230,200,117,0.08)" stroke="rgba(230,200,117,0.3)" />
    <text x="1185" y="72" fill="#e6c875" font-size="11" font-weight="600" letter-spacing="1">ZERO CONFIG DRIFT</text>

    <rect x="1350" y="52" width="170" height="30" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" />
    <text x="1365" y="72" fill="#34d399" font-size="11" font-weight="600" letter-spacing="1">ROLLOUT: VERIFIED</text>
  </g>

  <!-- Left Half: CI/CD Pipeline Workflow Visualizer -->
  <g id="pipeline-stages" filter="url(#shadow2)">
    <rect x="60" y="120" width="860" height="640" rx="18" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <text x="95" y="165" fill="#e6c875" font-size="14" font-weight="600" letter-spacing="2">AUTOMATED RELEASE PIPELINE // AZURE DEVOPS &amp; TFS</text>
    <text x="95" y="188" fill="#71717a" font-size="11">COMMIT-TO-PRODUCTION LIFECYCLE • ARTIFACT VALIDATION • POST-DEPLOY SANITY CHECK</text>
    <line x1="95" y1="205" x2="885" y2="205" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Stage 1: Code Repository -->
    <g transform="translate(95, 240)">
      <rect x="0" y="0" width="220" height="115" rx="12" fill="#0d1512" stroke="#e6c875" stroke-width="1.2" />
      <circle cx="28" cy="28" r="10" fill="rgba(230,200,117,0.15)" />
      <text x="28" y="32" fill="#e6c875" font-size="10" text-anchor="middle">01</text>
      <text x="46" y="32" fill="#f5f5f7" font-size="12" font-weight="600">GIT / TFS COMMIT</text>
      <text x="16" y="60" fill="#a1a1aa" font-size="10">Branch: <tspan fill="#e6c875">release/v3.4.2</tspan></text>
      <text x="16" y="78" fill="#71717a" font-size="10">Signed Commit SHA: 8a4c9b1</text>
      <text x="16" y="96" fill="#34d399" font-size="10">✔ Webhook Triggered</text>
    </g>

    <!-- Connector 1 to 2 -->
    <path d="M 315 297 L 375 297" stroke="url(#pipelineLine)" stroke-width="2.5" stroke-dasharray="6 3" />
    <polygon points="380,297 372,293 372,301" fill="#10b981" />

    <!-- Stage 2: Build & Maven -->
    <g transform="translate(385, 240)">
      <rect x="0" y="0" width="220" height="115" rx="12" fill="#0d1512" stroke="#10b981" stroke-width="1.2" />
      <circle cx="28" cy="28" r="10" fill="rgba(16,185,129,0.15)" />
      <text x="28" y="32" fill="#10b981" font-size="10" text-anchor="middle">02</text>
      <text x="46" y="32" fill="#f5f5f7" font-size="12" font-weight="600">MAVEN BUILD &amp; PKG</text>
      <text x="16" y="60" fill="#a1a1aa" font-size="10">JDK: <tspan fill="#38bdf8">OpenJDK 17 LTS</tspan></text>
      <text x="16" y="78" fill="#71717a" font-size="10">Artifact: <tspan fill="#f5f5f7">fintech-core.jar</tspan></text>
      <text x="16" y="96" fill="#34d399" font-size="10">✔ Build Passed (2m 14s)</text>
    </g>

    <!-- Connector 2 to 3 -->
    <path d="M 605 297 L 665 297" stroke="url(#pipelineLine)" stroke-width="2.5" stroke-dasharray="6 3" />
    <polygon points="670,297 662,293 662,301" fill="#10b981" />

    <!-- Stage 3: Security & Compliance Scan -->
    <g transform="translate(675, 240)">
      <rect x="0" y="0" width="200" height="115" rx="12" fill="#0d1512" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
      <circle cx="28" cy="28" r="10" fill="rgba(56,189,248,0.15)" />
      <text x="28" y="32" fill="#38bdf8" font-size="10" text-anchor="middle">03</text>
      <text x="46" y="32" fill="#f5f5f7" font-size="12" font-weight="600">SECURITY AUDIT</text>
      <text x="16" y="60" fill="#a1a1aa" font-size="10">SAST: <tspan fill="#34d399">0 Vulnerabilities</tspan></text>
      <text x="16" y="78" fill="#71717a" font-size="10">Deps: CVE Checked</text>
      <text x="16" y="96" fill="#34d399" font-size="10">✔ Financial Compliance</text>
    </g>

    <!-- Downward Route connector from Stage 3 to Stage 4 -->
    <path d="M 775 355 L 775 405 L 205 405 L 205 440" stroke="url(#pipelineLine)" stroke-width="2.5" stroke-dasharray="6 3" />
    <polygon points="205,445 201,437 209,437" fill="#10b981" />

    <!-- Stage 4: Azure Release Pipeline -->
    <g transform="translate(95, 450)">
      <rect x="0" y="0" width="220" height="120" rx="12" fill="#0d1512" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="28" cy="28" r="10" fill="rgba(56,189,248,0.15)" />
      <text x="28" y="32" fill="#38bdf8" font-size="10" text-anchor="middle">04</text>
      <text x="46" y="32" fill="#f5f5f7" font-size="12" font-weight="600">AZURE RELEASE AGENT</text>
