      <text x="16" y="96" fill="#34d399" font-size="10">✔ SSH SCP Dispatched</text>
    </g>

    <!-- Connector 4 to 5 -->
    <path d="M 315 510 L 375 510" stroke="url(#pipelineLine)" stroke-width="2.5" stroke-dasharray="6 3" />
    <polygon points="380,510 372,506 372,514" fill="#10b981" />

    <!-- Stage 5: Linux Systemd Deployment -->
    <g transform="translate(385, 450)">
      <rect x="0" y="0" width="220" height="120" rx="12" fill="#0d1512" stroke="#e6c875" stroke-width="1.5" />
      <circle cx="28" cy="28" r="10" fill="rgba(230,200,117,0.2)" />
      <text x="28" y="32" fill="#e6c875" font-size="10" text-anchor="middle">05</text>
      <text x="46" y="32" fill="#f5f5f7" font-size="12" font-weight="600">SYSTEMD ROLLOUT</text>
      <text x="16" y="60" fill="#a1a1aa" font-size="10">Unit: <tspan fill="#e6c875">fintech-core.service</tspan></text>
      <text x="16" y="78" fill="#71717a" font-size="10">Graceful Socket Handoff</text>
      <text x="16" y="96" fill="#34d399" font-size="10">✔ Zero Downtime Switch</text>
    </g>

    <!-- Connector 5 to 6 -->
    <path d="M 605 510 L 665 510" stroke="url(#pipelineLine)" stroke-width="2.5" stroke-dasharray="6 3" />
    <polygon points="670,510 662,506 662,514" fill="#10b981" />

    <!-- Stage 6: Sanity Check & Health Verification -->
    <g transform="translate(675, 450)">
      <rect x="0" y="0" width="200" height="120" rx="12" fill="#0b1b14" stroke="#10b981" stroke-width="1.5" filter="url(#glowEmerald)" />
      <rect x="0" y="0" width="200" height="120" rx="12" fill="#0b1b14" stroke="#10b981" stroke-width="1.5" />
      <circle cx="28" cy="28" r="10" fill="rgba(16,185,129,0.25)" />
      <text x="28" y="32" fill="#10b981" font-size="10" text-anchor="middle">06</text>
      <text x="46" y="32" fill="#f5f5f7" font-size="12" font-weight="600">HEALTH VERIFIED</text>
      <text x="16" y="60" fill="#a1a1aa" font-size="10">HTTP Probe: <tspan fill="#34d399">200 OK (8ms)</tspan></text>
      <text x="16" y="78" fill="#71717a" font-size="10">DB Pool: Synchronized</text>
      <text x="16" y="96" fill="#34d399" font-size="10">✔ Production Certified</text>
    </g>

    <!-- Bottom Pipeline Summary Card -->
    <g transform="translate(95, 610)">
      <rect x="0" y="0" width="780" height="110" rx="12" fill="#0c120f" stroke="rgba(255,255,255,0.06)" />
      
      <g transform="translate(30, 30)">
        <text y="0" fill="#71717a" font-size="10">CYCLE TIME</text>
        <text y="24" fill="#34d399" font-size="20" font-weight="700">3m 12s</text>
        <text y="42" fill="#52525b" font-size="9">Commit to Prod Live</text>
      </g>

      <line x1="200" y1="20" x2="200" y2="90" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(230, 30)">
        <text y="0" fill="#71717a" font-size="10">CONFIGURATION DRIFT</text>
        <text y="24" fill="#e6c875" font-size="20" font-weight="700">0.00%</text>
        <text y="42" fill="#52525b" font-size="9">Strict Template Pinning</text>
      </g>

      <line x1="420" y1="20" x2="420" y2="90" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(450, 30)">
        <text y="0" fill="#71717a" font-size="10">ROLLBACK SAFETY</text>
        <text y="24" fill="#38bdf8" font-size="20" font-weight="700">&lt; 30 sec</text>
        <text y="42" fill="#52525b" font-size="9">Automated Backup Fallback</text>
      </g>

      <line x1="620" y1="20" x2="620" y2="90" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(650, 30)">
        <text y="0" fill="#71717a" font-size="10">FINTECH UPTIME</text>
        <text y="24" fill="#10b981" font-size="20" font-weight="700">99.99%</text>
        <text y="42" fill="#52525b" font-size="9">SLA Compliant</text>
      </g>
    </g>

  </g>

  <!-- Right Half: Systemd Linux Runtime Inspector Terminal -->
