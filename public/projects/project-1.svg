<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#07070a; font-family:'JetBrains Mono', 'SF Pro Display', -apple-system, monospace;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="60%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#09090f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6c875" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e6c875" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Gradients for Cards -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e0e17" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="streamGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6c875" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#e6c875" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="streamCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1600" height="900" fill="url(#bgGlow1)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="1080" cy="420" r="320" fill="url(#cyanGlow)" />
  <circle cx="480" cy="360" r="260" fill="url(#goldGlow)" />

  <!-- Top System Header Bar -->
  <g id="top-bar">
    <rect x="60" y="40" width="1480" height="54" rx="12" fill="#0d0d16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="95" cy="67" r="6" fill="#10b981" />
    <circle cx="95" cy="67" r="10" fill="#10b981" fill-opacity="0.2" />
    <text x="115" y="72" fill="#f5f5f7" font-size="13" font-weight="600" letter-spacing="1.5">SYS.ARCH // DOCKER COMPOSE RUNTIME</text>
    <text x="440" y="72" fill="#71717a" font-size="12">HOST: LINUX (UBUNTU 22.04 LTS)</text>

    <!-- Right HUD Tags -->
    <rect x="1200" y="52" width="125" height="30" rx="6" fill="rgba(230,200,117,0.08)" stroke="rgba(230,200,117,0.3)" />
    <text x="1215" y="72" fill="#e6c875" font-size="11" font-weight="600" letter-spacing="1">TLS 1.3 ACTIVE</text>

    <rect x="1340" y="52" width="180" height="30" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" />
    <text x="1355" y="72" fill="#34d399" font-size="11" font-weight="600" letter-spacing="1">CONTAINER NET: OK</text>
  </g>

  <!-- Left Panel: Terminal & Telemetry Logs -->
  <g id="terminal-panel" filter="url(#dropShadow)">
    <rect x="60" y="120" width="480" height="640" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Terminal Header -->
    <path d="M 60 138 C 60 128 68 120 78 120 L 522 120 C 532 120 540 128 540 138 L 540 166 L 60 166 Z" fill="#13131e" />
    <circle cx="88" cy="143" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="106" cy="143" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="124" cy="143" r="5" fill="#10b981" opacity="0.8"/>
    <text x="150" y="147" fill="#71717a" font-size="11">bash - sudharsan@prod-node-01: ~/platform</text>

    <!-- Terminal Code / Output -->
    <g transform="translate(85, 195)" font-size="12" line-height="1.6">
      <text y="0" fill="#e6c875" font-weight="600">$ docker compose -f docker-compose.yml up -d</text>
      <text y="28" fill="#a1a1aa">[+] Running 5/5</text>
      <text y="54" fill="#38bdf8"> ✔ Network platform_bridge_net    Created   0.1s</text>
      <text y="80" fill="#34d399"> ✔ Container nginx-gateway        Started   0.4s</text>
      <text y="106" fill="#34d399"> ✔ Container react-frontend        Started   0.3s</text>
      <text y="132" fill="#34d399"> ✔ Container golang-integration    Started   0.3s</text>
      <text y="158" fill="#34d399"> ✔ Container redis-session-cache   Started   0.2s</text>

      <text y="205" fill="#71717a">--- HEALTH CHECK INSPECTION ---</text>
      <text y="235" fill="#a1a1aa">$ docker inspect --format='{{json .State.Health}}'</text>
      <text y="260" fill="#10b981">● status: "healthy", failingStreak: 0</text>
      <text y="285" fill="#71717a">  last_check: "2026-09-17T22:30:12Z"</text>
      <text y="310" fill="#71717a">  http_probe: "GET /healthz 200 OK (3.2ms)"</text>

      <text y="355" fill="#e6c875" font-weight="600">$ nginx -t -c /etc/nginx/nginx.conf</text>
      <text y="380" fill="#38bdf8">nginx: the configuration file syntax is ok</text>
      <text y="405" fill="#34d399">nginx: configuration file test is successful</text>
      <text y="430" fill="#71717a">SSL_CIPHER: TLS_AES_256_GCM_SHA384</text>
      <text y="455" fill="#71717a">UPSTREAM: proxy_pass http://api_upstream</text>

      <rect x="0" y="480" width="12" height="18" fill="#e6c875" opacity="0.8"/>
    </g>

    <!-- Terminal Footer Badge -->
    <rect x="80" y="700" width="440" height="42" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
    <text x="100" y="726" fill="#a1a1aa" font-size="11">CONTAINER ISOLATION: <tspan fill="#e6c875">STRICT BRIDGING</tspan> | FAILOVER: <tspan fill="#34d399">RESTART UNLESS STOPPED</tspan></text>
  </g>

  <!-- Right Area: Architecture Topology Diagram -->
  <g id="topology-area" filter="url(#dropShadow)">
    
    <!-- Outer Container Frame -->
    <rect x="570" y="120" width="970" height="640" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Diagram Section Header -->
    <text x="610" y="165" fill="#e6c875" font-size="14" font-weight="600" letter-spacing="2">ACTIVE TOPOLOGY // CONTAINER RUNTIME &amp; INGRESS</text>
    <text x="610" y="188" fill="#71717a" font-size="11">ISOLATED BRIDGE NETWORK: 172.24.0.0/16 • NGINX MULTI-PORT FORWARDING</text>
    <line x1="610" y1="205" x2="1490" y2="205" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- External Client Ingress Node -->
    <g transform="translate(620, 360)">
      <rect x="0" y="0" width="160" height="110" rx="14" fill="#131320" stroke="#e6c875" stroke-width="1.5" />
      <circle cx="80" cy="30" r="16" fill="rgba(230,200,117,0.12)" />
      <circle cx="80" cy="30" r="9" fill="none" stroke="#e6c875" stroke-width="1.5" />
      <path d="M 71 30 H 89 M 80 21 V 39" stroke="#e6c875" stroke-width="1.2" />
      <text x="80" y="66" fill="#f5f5f7" font-size="12" font-weight="600" text-anchor="middle">CLIENT TRAFFIC</text>
      <text x="80" y="85" fill="#e6c875" font-size="10" text-anchor="middle">HTTPS : 443 / SSL</text>
      <text x="80" y="99" fill="#71717a" font-size="9" text-anchor="middle">Public DNS Ingress</text>
    </g>

    <!-- Connector: Client to Nginx -->
    <path d="M 780 415 L 850 415" stroke="url(#streamGold)" stroke-width="3" stroke-dasharray="8 4" />
    <polygon points="854,415 844,410 844,420" fill="#e6c875" />

    <!-- NGINX Gateway Node -->
    <g transform="translate(860, 310)">
      <rect x="0" y="0" width="200" height="210" rx="16" fill="#101827" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowCyan)" />
      <rect x="0" y="0" width="200" height="210" rx="16" fill="#101827" stroke="#38bdf8" stroke-width="1.5" />
      
      <!-- Nginx Header -->
      <rect x="15" y="15" width="170" height="28" rx="6" fill="rgba(56,189,248,0.12)" />
      <text x="100" y="34" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">NGINX GATEWAY</text>
      
      <text x="20" y="70" fill="#a1a1aa" font-size="11">PORT: <tspan fill="#f5f5f7">443 / 80</tspan></text>
      <text x="20" y="92" fill="#a1a1aa" font-size="11">TLS: <tspan fill="#34d399">Certbot / Auto-renew</tspan></text>
      <text x="20" y="114" fill="#a1a1aa" font-size="11">SECURITY: <tspan fill="#e6c875">CORS / CSP</tspan></text>
      <text x="20" y="136" fill="#a1a1aa" font-size="11">ROUTING: <tspan fill="#f5f5f7">L7 Path Based</tspan></text>
      
      <rect x="15" y="155" width="170" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <text x="25" y="172" fill="#71717a" font-size="9">/ -&gt; frontend_container:80</text>
      <text x="25" y="186" fill="#71717a" font-size="9">/api/v1 -&gt; backend_api:8080</text>
    </g>

    <!-- Connector: Nginx to 3 Microservices -->
    <path d="M 1060 370 C 1110 370, 1120 270, 1170 270" stroke="url(#streamCyan)" stroke-width="2.5" stroke-dasharray="6 4" />
    <polygon points="1174,270 1164,265 1164,275" fill="#38bdf8" />

    <path d="M 1060 415 L 1170 415" stroke="url(#streamGold)" stroke-width="2.5" stroke-dasharray="6 4" />
    <polygon points="1174,415 1164,410 1164,420" fill="#e6c875" />

    <path d="M 1060 460 C 1110 460, 1120 560, 1170 560" stroke="url(#streamCyan)" stroke-width="2.5" stroke-dasharray="6 4" />
    <polygon points="1174,560 1164,555 1164,565" fill="#38bdf8" />

    <!-- Microservice 1: React Frontend -->
    <g transform="translate(1180, 220)">
      <rect x="0" y="0" width="310" height="100" rx="14" fill="#0f172a" stroke="rgba(56,189,248,0.4)" stroke-width="1.2" />
      <circle cx="28" cy="28" r="10" fill="rgba(56,189,248,0.15)" />
      <text x="28" y="32" fill="#38bdf8" font-size="10" text-anchor="middle">SPA</text>
      <text x="48" y="32" fill="#f5f5f7" font-size="13" font-weight="600">FRONTEND (REACT 18)</text>
      <text x="20" y="60" fill="#a1a1aa" font-size="10">RUNTIME: <tspan fill="#38bdf8">Nginx Alpine Container</tspan></text>
      <text x="20" y="78" fill="#71717a" font-size="10">PORT: 80 (Internal) • MEMORY: 42MB</text>
      <rect x="235" y="16" width="60" height="22" rx="5" fill="rgba(16,185,129,0.15)" />
      <text x="265" y="31" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">HEALTHY</text>
    </g>

    <!-- Microservice 2: Golang Backend API -->
    <g transform="translate(1180, 365)">
      <rect x="0" y="0" width="310" height="100" rx="14" fill="#181528" stroke="#e6c875" stroke-width="1.5" />
      <circle cx="28" cy="28" r="10" fill="rgba(230,200,117,0.2)" />
      <text x="28" y="32" fill="#e6c875" font-size="10" text-anchor="middle">API</text>
      <text x="48" y="32" fill="#f5f5f7" font-size="13" font-weight="600">INTEGRATION API (GOLANG)</text>
      <text x="20" y="60" fill="#a1a1aa" font-size="10">RUNTIME: <tspan fill="#e6c875">Distroless Scratch Binary</tspan></text>
      <text x="20" y="78" fill="#71717a" font-size="10">PORT: 8080 • CONCURRENCY: 2.5K GOROUTINES</text>
      <rect x="235" y="16" width="60" height="22" rx="5" fill="rgba(16,185,129,0.15)" />
      <text x="265" y="31" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">HEALTHY</text>
    </g>

    <!-- Microservice 3: Redis Cache -->
    <g transform="translate(1180, 510)">
      <rect x="0" y="0" width="310" height="100" rx="14" fill="#1a111a" stroke="rgba(244,63,94,0.4)" stroke-width="1.2" />
      <circle cx="28" cy="28" r="10" fill="rgba(244,63,94,0.15)" />
      <text x="28" y="32" fill="#fb7185" font-size="10" text-anchor="middle">MEM</text>
      <text x="48" y="32" fill="#f5f5f7" font-size="13" font-weight="600">CACHE LAYER (REDIS v7)</text>
      <text x="20" y="60" fill="#a1a1aa" font-size="10">RUNTIME: <tspan fill="#fb7185">Alpine In-Memory DB</tspan></text>
      <text x="20" y="78" fill="#71717a" font-size="10">PORT: 6379 • HIT RATE: 94.6% • SUB-MS LATENCY</text>
      <rect x="235" y="16" width="60" height="22" rx="5" fill="rgba(16,185,129,0.15)" />
      <text x="265" y="31" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">HEALTHY</text>
    </g>

    <!-- Inter-service connection: Backend to Redis -->
    <path d="M 1335 465 L 1335 510" stroke="#e6c875" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Bottom Telemetry HUD Bar inside Diagram -->
    <g transform="translate(600, 645)">
      <rect x="0" y="0" width="910" height="75" rx="12" fill="#090911" stroke="rgba(255,255,255,0.06)" />
      
      <g transform="translate(30, 24)">
        <text y="0" fill="#71717a" font-size="10">AVG RESPONSE TIME</text>
        <text y="24" fill="#34d399" font-size="18" font-weight="700">18.4 ms</text>
      </g>
      
      <line x1="220" y1="15" x2="220" y2="60" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(250, 24)">
        <text y="0" fill="#71717a" font-size="10">ACTIVE TRAFFIC THROUGHPUT</text>
        <text y="24" fill="#e6c875" font-size="18" font-weight="700">4,280 req/sec</text>
      </g>

      <line x1="470" y1="15" x2="470" y2="60" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(500, 24)">
        <text y="0" fill="#71717a" font-size="10">NETWORK PACKET DROP</text>
        <text y="24" fill="#38bdf8" font-size="18" font-weight="700">0.000%</text>
      </g>

      <line x1="690" y1="15" x2="690" y2="60" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(720, 24)">
        <text y="0" fill="#71717a" font-size="10">SERVICE UPTIME</text>
        <text y="24" fill="#10b981" font-size="18" font-weight="700">99.99%</text>
      </g>
    </g>

  </g>

  <!-- Bottom Brand Watermark -->
  <text x="60" y="810" fill="#52525b" font-size="12" letter-spacing="3">SUDHARSAN S // SRE &amp; DEVOPS PORTFOLIO</text>
  <text x="1540" y="810" fill="#52525b" font-size="12" text-anchor="end">PRODUCTION CONTAINER PLATFORM</text>
</svg>
