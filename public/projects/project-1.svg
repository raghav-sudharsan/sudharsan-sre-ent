<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#07070a; font-family:'JetBrains Mono', 'SF Pro Display', -apple-system, monospace;">
  <defs>
    <radialGradient id="bgGlow1" cx="60%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#09090f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6c875" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e6c875" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e0e17" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="streamGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6c875" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#e6c875" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow1)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <circle cx="1080" cy="420" r="320" fill="url(#cyanGlow)" />
  <circle cx="480" cy="360" r="260" fill="url(#goldGlow)" />

  <!-- Top System Header Bar -->
  <g id="top-bar">
    <rect x="60" y="40" width="1480" height="54" rx="12" fill="#0d0d16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="95" cy="67" r="6" fill="#10b981" />
    <circle cx="95" cy="67" r="10" fill="#10b981" fill-opacity="0.2" />
    <text x="115" y="72" fill="#f5f5f7" font-size="13" font-weight="600" letter-spacing="1.5">INTEGRATION PLATFORM // SERVICE RUNTIME &amp; INGRESS</text>
    <text x="610" y="72" fill="#71717a" font-size="12">FLOW: FRONTEND → NGINX → API → ADAPTERS → SERVICES → CONSUL / REDIS → DB</text>

    <rect x="1200" y="52" width="125" height="30" rx="6" fill="rgba(230,200,117,0.08)" stroke="rgba(230,200,117,0.3)" />
    <text x="1215" y="72" fill="#e6c875" font-size="11" font-weight="600" letter-spacing="1">TLS 1.3 ACTIVE</text>

    <rect x="1340" y="52" width="180" height="30" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" />
    <text x="1355" y="72" fill="#34d399" font-size="11" font-weight="600" letter-spacing="1">DOCKER BRIDGED: OK</text>
  </g>

  <!-- Left Panel: Terminal & Telemetry Logs -->
  <g id="terminal-panel" filter="url(#dropShadow)">
    <rect x="60" y="120" width="480" height="640" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 60 138 C 60 128 68 120 78 120 L 522 120 C 532 120 540 128 540 138 L 540 166 L 60 166 Z" fill="#13131e" />
    <circle cx="88" cy="143" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="106" cy="143" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="124" cy="143" r="5" fill="#10b981" opacity="0.8"/>
    <text x="150" y="147" fill="#71717a" font-size="11">bash - sudharsan@integration-node: ~/app</text>

    <g transform="translate(85, 195)" font-size="12" line-height="1.6">
      <text y="0" fill="#e6c875" font-weight="600">$ docker compose -f docker-compose.yml up -d</text>
      <text y="28" fill="#a1a1aa">[+] Running 6/6</text>
      <text y="54" fill="#38bdf8"> ✔ Network integration_bridge_net Created 0.1s</text>
      <text y="80" fill="#34d399"> ✔ Container nginx-gateway        Started 0.3s</text>
      <text y="106" fill="#34d399"> ✔ Container react-vite-ui        Started 0.3s</text>
      <text y="132" fill="#34d399"> ✔ Container go-api-handler       Started 0.2s</text>
      <text y="158" fill="#34d399"> ✔ Container consul-discovery     Started 0.2s</text>
      <text y="184" fill="#34d399"> ✔ Container redis-session-cache  Started 0.2s</text>

      <text y="225" fill="#71717a">--- CORS &amp; INGRESS VERIFICATION ---</text>
      <text y="255" fill="#a1a1aa">$ curl -I -X OPTIONS https://api.local/v1/adapters</text>
      <text y="280" fill="#10b981">HTTP/1.1 204 No Content</text>
      <text y="305" fill="#71717a">Access-Control-Allow-Origin: https://app.local</text>
      <text y="330" fill="#71717a">Access-Control-Allow-Methods: GET, POST, OPTIONS</text>
      <text y="355" fill="#71717a">Access-Control-Allow-Headers: Authorization, Content-Type</text>

      <text y="395" fill="#e6c875" font-weight="600">$ consul members</text>
      <text y="420" fill="#38bdf8">Node: go-integration-svc  Address: 172.24.0.5:8500  Status: alive</text>
      <text y="445" fill="#34d399">Consul key/value registry synchronized</text>
      <text y="470" fill="#71717a">Redis cache cluster ping: PONG (0.4ms)</text>

      <rect x="0" y="495" width="12" height="18" fill="#e6c875" opacity="0.8"/>
    </g>

    <rect x="80" y="700" width="440" height="42" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
    <text x="100" y="726" fill="#a1a1aa" font-size="11">DEPLOYMENT TARGET: <tspan fill="#e6c875">LINUX (DOCKER)</tspan> | PROXY: <tspan fill="#34d399">NGINX REVERSE PROXY</tspan></text>
  </g>

  <!-- Right Area: Architecture Topology Diagram -->
  <g id="topology-area" filter="url(#dropShadow)">
    <rect x="570" y="120" width="970" height="640" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="610" y="165" fill="#e6c875" font-size="14" font-weight="600" letter-spacing="2">INTEGRATION PLATFORM TOPOLOGY</text>
    <text x="610" y="188" fill="#71717a" font-size="11">FRONTEND → NGINX → API/APP HANDLER → ADAPTERS → SERVICES → CONSUL / REDIS → DATABASE</text>
    <line x1="610" y1="205" x2="1490" y2="205" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Step 1: User Ingress -->
    <g transform="translate(610, 240)">
      <rect x="0" y="0" width="160" height="100" rx="12" fill="#131320" stroke="#e6c875" stroke-width="1.5" />
      <text x="80" y="32" fill="#e6c875" font-size="11" text-anchor="middle" font-weight="600">USER INGRESS</text>
      <text x="80" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">HTTPS / Browser</text>
      <text x="80" y="75" fill="#71717a" font-size="10" text-anchor="middle">Port 443 / TLS 1.3</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 770 290 L 820 290" stroke="url(#streamGold)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 2: Nginx Gateway -->
    <g transform="translate(825, 240)">
      <rect x="0" y="0" width="180" height="100" rx="12" fill="#101827" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowCyan)" />
      <rect x="0" y="0" width="180" height="100" rx="12" fill="#101827" stroke="#38bdf8" stroke-width="1.5" />
      <text x="90" y="32" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="700">NGINX GATEWAY</text>
      <text x="90" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Reverse Proxy / SSL</text>
      <text x="90" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">CORS &amp; Path Router</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 1005 290 L 1055 290" stroke="url(#streamGold)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 3: React Frontend & Go API -->
    <g transform="translate(1060, 240)">
      <rect x="0" y="0" width="200" height="100" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="100" y="32" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="600">FRONTEND (REACT)</text>
      <text x="100" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Single Page App</text>
      <text x="100" y="75" fill="#71717a" font-size="10" text-anchor="middle">Port 80 (Internal)</text>
    </g>

    <!-- Down Arrow to Step 4 -->
    <path d="M 1160 340 L 1160 395 L 700 395 L 700 435" stroke="url(#streamGold)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 4: API & App Handler (Go) -->
    <g transform="translate(610, 440)">
      <rect x="0" y="0" width="180" height="110" rx="12" fill="#181528" stroke="#e6c875" stroke-width="1.5" />
      <text x="90" y="32" fill="#e6c875" font-size="11" text-anchor="middle" font-weight="600">API / APP HANDLER</text>
      <text x="90" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Golang Runtime</text>
      <text x="90" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">Port 8080 • Goroutines</text>
      <text x="90" y="93" fill="#34d399" font-size="9" text-anchor="middle">HEALTHY</text>
    </g>

    <!-- Arrow 4 to 5 -->
    <path d="M 790 495 L 840 495" stroke="url(#streamGold)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 5: Integration Adapters -->
    <g transform="translate(845, 440)">
      <rect x="0" y="0" width="180" height="110" rx="12" fill="#111827" stroke="#a855f7" stroke-width="1.2" />
      <text x="90" y="32" fill="#c084fc" font-size="11" text-anchor="middle" font-weight="600">INTEGRATION ADAPTERS</text>
      <text x="90" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Payload Translators</text>
      <text x="90" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">Protocol Abstraction</text>
      <text x="90" y="93" fill="#38bdf8" font-size="9" text-anchor="middle">Modular Connectors</text>
    </g>

    <!-- Arrow 5 to 6 -->
    <path d="M 1025 495 L 1075 495" stroke="url(#streamGold)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 6: Microservices (Go / Docker) -->
    <g transform="translate(1080, 440)">
      <rect x="0" y="0" width="180" height="110" rx="12" fill="#0c1a17" stroke="#10b981" stroke-width="1.2" />
      <text x="90" y="32" fill="#34d399" font-size="11" text-anchor="middle" font-weight="600">CORE SERVICES</text>
      <text x="90" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Docker Containerized</text>
      <text x="90" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">Business Logic Engine</text>
      <text x="90" y="93" fill="#34d399" font-size="9" text-anchor="middle">Linux systemd / compose</text>
    </g>

    <!-- Arrow 6 to 7 -->
    <path d="M 1260 495 L 1310 495" stroke="url(#streamGold)" stroke-width="2" stroke-dasharray="4 3" />

    <!-- Step 7: Consul & Redis -->
    <g transform="translate(1315, 440)">
      <rect x="0" y="0" width="200" height="110" rx="12" fill="#1f131a" stroke="#fb7185" stroke-width="1.2" />
      <text x="100" y="32" fill="#fb7185" font-size="11" text-anchor="middle" font-weight="600">CONSUL &amp; REDIS</text>
      <text x="100" y="55" fill="#f5f5f7" font-size="11" text-anchor="middle">Discovery &amp; Cache</text>
      <text x="100" y="75" fill="#a1a1aa" font-size="10" text-anchor="middle">KV Registry • Fast Store</text>
      <text x="100" y="93" fill="#34d399" font-size="9" text-anchor="middle">Sub-ms Session Hit</text>
    </g>

    <!-- Bottom Step 8: Database Persistence -->
    <g transform="translate(900, 580)">
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#14141e" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="185" y="26" fill="#e6c875" font-size="11" text-anchor="middle" font-weight="600">DATABASE PERSISTENCE // SQL SERVER</text>
      <text x="185" y="46" fill="#a1a1aa" font-size="10" text-anchor="middle">Transactional Consistency • Automated Backup &amp; Verification</text>
    </g>

    <!-- Connectors down to DB -->
    <path d="M 1170 550 L 1170 580" stroke="#e6c875" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 1415 550 L 1415 610 L 1270 610" stroke="#fb7185" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Bottom Telemetry HUD Bar inside Diagram -->
    <g transform="translate(600, 660)">
      <rect x="0" y="0" width="910" height="70" rx="12" fill="#090911" stroke="rgba(255,255,255,0.06)" />
      
      <g transform="translate(30, 24)">
        <text y="0" fill="#71717a" font-size="10">REVERSE PROXY</text>
        <text y="24" fill="#38bdf8" font-size="16" font-weight="700">Nginx / TLS 1.3</text>
      </g>
      <line x1="220" y1="15" x2="220" y2="55" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(250, 24)">
        <text y="0" fill="#71717a" font-size="10">SERVICE DISCOVERY</text>
        <text y="24" fill="#fb7185" font-size="16" font-weight="700">Consul + Redis</text>
      </g>
      <line x1="470" y1="15" x2="470" y2="55" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(500, 24)">
        <text y="0" fill="#71717a" font-size="10">DEPLOYMENT TARGET</text>
        <text y="24" fill="#e6c875" font-size="16" font-weight="700">Linux / Docker</text>
      </g>
      <line x1="690" y1="15" x2="690" y2="55" stroke="rgba(255,255,255,0.06)" />

      <g transform="translate(720, 24)">
        <text y="0" fill="#71717a" font-size="10">RUNTIME HEALTH</text>
        <text y="24" fill="#10b981" font-size="16" font-weight="700">100% Passing</text>
      </g>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="60" y="810" fill="#52525b" font-size="12" letter-spacing="3">SUDHARSAN S // SRE &amp; DEVOPS PORTFOLIO</text>
  <text x="1540" y="810" fill="#52525b" font-size="12" text-anchor="end">INTEGRATION PLATFORM OPERATIONS</text>
</svg>
