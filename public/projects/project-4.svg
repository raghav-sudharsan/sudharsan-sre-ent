<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#07070a; font-family:'JetBrains Mono', 'SF Pro Display', -apple-system, monospace;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow4" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#090d14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="goldGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6c875" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e6c875" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
